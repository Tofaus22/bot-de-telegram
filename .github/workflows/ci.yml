name: Quality Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev tools
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Typecheck
        run: mypy src

      - name: Run tests
        run: python -m unittest discover -s tests -v
